name: Build HighStack 3D APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Blender 5.2.1 LTS
        run: |
          curl -L --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xf blender.tar.xz
          mv blender-5.2.1-linux-x64 blender
          ./blender/blender --version | head -n 2

      - name: Generate original 3D asset pack with Blender
        run: |
          mkdir -p game/assets/models
          ./blender/blender -b --python tools/blender_assets.py
          ls -lh game/assets/models

      - name: Generate original music and sound effects
        run: python3 tools/audio_assets.py

      - name: Download Godot 4.7.2 and Android templates
        run: |
          curl -L --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf "$PWD/godot-bin/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -L --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/highstack-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=HighStack Debug,O=HighStack Studio,C=VN" -keyalg RSA -keysize 2048 -validity 10000

      - name: Import project assets and validate scripts
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          godot --headless --editor --path game --quit

      - name: Runtime smoke test
        run: |
          mkdir -p build
          timeout 120 godot --headless --path game -- --smoke 2>&1 | tee build/smoke.log
          grep -q "HIGHSTACK_SMOKE: .*checks, 0 failures" build/smoke.log
          ! grep -E "SCRIPT ERROR|^ERROR:" build/smoke.log

      - name: Export signed debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/highstack-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          mkdir -p build
          godot --headless --path game --export-debug Android "$PWD/build/HighStack3D-v0.3.0.apk"

      - name: Verify APK
        run: |
          test -s build/HighStack3D-v0.3.0.apk
          unzip -t build/HighStack3D-v0.3.0.apk >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/HighStack3D-v0.3.0.apk | tee build/signature.txt
          sha256sum build/HighStack3D-v0.3.0.apk | tee build/HighStack3D-v0.3.0.sha256
          du -h build/HighStack3D-v0.3.0.apk

      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install build/HighStack3D-v0.3.0.apk
            adb logcat -c
            adb shell monkey -p com.highstackstudio.highstack3d 1
            sleep 8
            adb shell pidof com.highstackstudio.highstack3d
            adb shell input tap 540 1740
            sleep 5
            adb shell pidof com.highstackstudio.highstack3d
            adb exec-out screencap -p > build/android-gameplay.png
            adb logcat -d > build/android-logcat.txt
            ! grep -E 'FATAL EXCEPTION|SCRIPT ERROR|Parse Error' build/android-logcat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HighStack3D-3D-APK
          path: |
            build/HighStack3D-v0.3.0.apk
            build/HighStack3D-v0.3.0.sha256
            build/smoke.log
            build/signature.txt
            build/android-gameplay.png
            build/android-logcat.txt
          if-no-files-found: error
